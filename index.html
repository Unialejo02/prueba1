<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVVA VALLE · Sistema Electoral</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div id="toast"></div>
<div id="loading" class="hidden">
  <div class="spinner"></div>
  <p id="loadingMsg">Guardando...</p>
</div>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-shield">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="55" fill="none" stroke="#d1e8e8" stroke-width="1" stroke-dasharray="3,3"/>
          <circle cx="60" cy="60" r="42" fill="none" stroke="#d1e8e8" stroke-width="1" stroke-dasharray="3,3"/>
          <circle cx="60" cy="60" r="28" fill="none" stroke="#d1e8e8" stroke-width="1" stroke-dasharray="3,3"/>
          <line x1="60" y1="4" x2="60" y2="20" stroke="#b0d4d4" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="60" y1="100" x2="60" y2="116" stroke="#b0d4d4" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="4" y1="60" x2="20" y2="60" stroke="#b0d4d4" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="100" y1="60" x2="116" y2="60" stroke="#b0d4d4" stroke-width="1.5" stroke-linecap="round"/>
          <polygon points="60,2 57,10 63,10" fill="#1a9696"/>
          <polygon points="60,118 57,110 63,110" fill="#1a9696"/>
          <polygon points="2,60 10,57 10,63" fill="#1a9696"/>
          <polygon points="118,60 110,57 110,63" fill="#1a9696"/>
          <path d="M52,25 C50,24 47,25 45,27 C43,29 42,32 40,34 C38,36 35,37 34,40
                   C33,43 34,46 33,49 C32,52 30,54 30,57 C30,60 32,62 33,65
                   C34,68 34,71 36,73 C38,75 41,75 43,77 C45,79 46,82 48,84
                   C50,86 53,87 55,89 C57,91 58,94 60,95 C62,94 64,91 66,89
                   C68,87 71,87 73,85 C75,83 75,80 77,78 C79,76 82,75 83,72
                   C84,69 83,66 84,63 C85,60 87,58 87,55 C87,52 85,50 84,47
                   C83,44 83,41 81,39 C79,37 76,37 74,35 C72,33 71,30 69,28
                   C67,26 64,25 62,24 C60,23 57,23 55,23 Z"
                fill="#1a9696" opacity="0.9"/>
        </svg>
      </div>
      <h1><span class="nova">NOVVA</span><span class="valle">VALLE</span></h1>
      <p>Sistema de Gestión Electoral · 2026</p>
    </div>
    <div class="login-form">
      <div class="field">
        <label class="lbl">Usuario</label>
        <input id="loginUser" type="text" placeholder="Tu usuario" autocomplete="username"
          autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label class="lbl">Contraseña</label>
        <div style="position:relative">
          <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password"
            autocapitalize="none" autocorrect="off" spellcheck="false" style="padding-right:44px">
          <button type="button" onclick="togglePass()" id="togglePassBtn"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
            background:none;border:none;cursor:pointer;padding:4px;color:#94a3b8">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="login-err" id="loginErr"></div>
      <button class="btn-primary" onclick="doLogin()">Ingresar al sistema</button>
    </div>
    <p class="login-note">Acceso exclusivo · NOVVA VALLE 2026</p>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script>
window.onload = () => {
  if(checkSession()) redirectToRole();
  document.getElementById('loginUser').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginPass').focus(); });
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
};
</script>
</body>
</html>
